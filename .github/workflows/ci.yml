name: VettedRent Trust Stack Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build_and_verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      # npm run lint is tsc --noEmit. A type error fails the job.
      - name: Verify TypeScript
        run: npm run lint

      - name: Compile and Verify Complete Next.js Trust Stack
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          SEAM_API_KEY: seam_ci
          PLAID_CLIENT_ID: ci-plaid-client
          PLAID_SECRET: ci-plaid-secret
          PLAID_ENV: sandbox
          ENTERPRISE_PORTAL_KEY: ci-enterprise-portal-key
